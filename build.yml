name: Build Roothide Tweak (.deb)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Roothide Theos & iOS SDK
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          curl -LO https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C $HOME/theos/sdks/

      - name: Build Roothide .deb
        env:
          THEOS: ${{ env.HOME }}/theos
        run: |
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload Roothide .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneiOS26UI-roothide-deb
          path: packages/*.deb
